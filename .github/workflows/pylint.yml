name: pylint
on: [push, pull_request]

jobs:
  PEP8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python lint libraries
        run: |
          python -m pip install --upgrade pip
          pip install autopep8 autoflake isort black

      - name: Check for showstoppers
        run: |
          autopep8 --verbose --in-place --recursive --aggressive --aggressive ./*.py

      - name: Remove unused imports and variables
        run: |
          autoflake --in-place --recursive --remove-all-unused-imports --remove-unused-variables --ignore-init-module-imports .

      - name: Lint with isort and black
        run: |
          isort userbot/modules/*.py
          black userbot/modules/*.py

      - name: Setup GPG
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.gnupg/
          chmod 700 ~/.gnupg/
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf

      - name: Import GPG key
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --yes --import
        continue-on-error: true

      - name: Verify GPG key
        if: github.event_name == 'push'
        run: |
          gpg --list-secret-keys --keyid-format LONG
        continue-on-error: true

      - name: Configure Git
        if: github.event_name == 'push'
        run: |
          git config --global user.email "niteshraj231@outlook.com"
          git config --global user.name "Nitesh"
          git config --global commit.gpgSign true
          git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"

      - name: Commit and push changes
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -S -m "Apply automatic formatting"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit"
          fi